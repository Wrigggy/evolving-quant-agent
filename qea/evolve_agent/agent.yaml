type: agent
name: qea_evolve_agent
max_context_tokens: 200000
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
max_iterations: 30

llm_config:
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  max_tokens: 32000
  temperature: 0.3
  stream: true
  api_type: openai_chat_completion
  timeout: 180

tools:
  # Structured file-edit tools (reliable for multi-line YAML/Python — a weak executor
  # fumbles shell heredocs). read/inspect + write/replace are the primary edit path;
  # run_shell_command remains for verification (yaml parse) + anything ad-hoc.
  - name: read_file
    yaml_path: ./tool_descriptions/read_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools.read_file:read_file
  - name: write_file
    yaml_path: ./tool_descriptions/write_file.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools.write_file:write_file
  - name: replace
    yaml_path: ./tool_descriptions/replace.tool.yaml
    binding: nexau.archs.tool.builtin.file_tools.replace:replace
  - name: run_shell_command
    yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
    binding: nexau.archs.tool.builtin.shell_tools.run_shell_command:run_shell_command
  # AHE-style self-test: execute Python in the worker dir to verify synthesized/edited
  # tool code actually imports + runs before finishing (critical for code-synthesis tiers).
  - name: run_code
    yaml_path: ./tool_descriptions/run_code.tool.yaml
    binding: nexau.archs.tool.builtin.run_code_tool:run_code_tool

tracers:
  - import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
