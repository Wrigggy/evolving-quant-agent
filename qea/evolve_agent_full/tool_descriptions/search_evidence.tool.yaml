type: tool
name: search_evidence
description: Regex-search the immutable evidence corpus and return bounded file, line, and text matches.
input_schema:
  type: object
  properties:
    pattern: {type: string, description: "Case-insensitive regular expression, at most 256 characters."}
    max_hits: {type: integer, minimum: 1, maximum: 500, default: 100}
  required: [pattern]
  additionalProperties: false

