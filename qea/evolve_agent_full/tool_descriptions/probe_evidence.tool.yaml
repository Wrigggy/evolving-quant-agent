type: tool
name: probe_evidence
description: Run one bounded, deterministic structural probe over exact authorized JSON, CSV, trace, or text evidence. The probe records competing hypothesis expectations before returning observations and cannot execute arbitrary code, use the network, access evaluator material, or mutate the candidate.
input_schema:
  type: object
  properties:
    probe_id:
      type: string
      pattern: "^[a-z][a-z0-9_-]{0,63}$"
    question: {type: string}
    hypothesis_expectations:
      type: object
      minProperties: 2
      additionalProperties: {type: string}
    evidence_paths:
      type: array
      minItems: 1
      maxItems: 12
      items: {type: string}
    operation:
      type: string
      enum: [profile, compare_profiles]
      default: compare_profiles
  required: [probe_id, question, hypothesis_expectations, evidence_paths]
  additionalProperties: false
