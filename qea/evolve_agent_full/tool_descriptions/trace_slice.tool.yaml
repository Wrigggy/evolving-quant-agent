type: tool
name: trace_slice
description: Search one authorized evidence trace or text file and return bounded matches with nearby lines for behavioral localization.
input_schema:
  type: object
  properties:
    file_path: {type: string, description: "Exact safe path relative to the evidence root."}
    pattern: {type: string, description: "Case-insensitive regex, at most 256 characters."}
    context_lines: {type: integer, minimum: 0, maximum: 20, default: 3}
    max_matches: {type: integer, minimum: 1, maximum: 100, default: 20}
  required: [file_path, pattern]
  additionalProperties: false
