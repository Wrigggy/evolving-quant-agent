type: tool
name: decide_candidate
description: Record an evidence-backed ACT or ABSTAIN decision. Failure-type contracts require a discriminating probe; QuantCodeEval v2 instead requires competing mechanism hypotheses, exact accessed history when available, one or two primary components, and any binding components needed for one coherent mechanism.
input_schema:
  type: object
  properties:
    discovery:
      type: object
      properties:
        decision:
          type: string
          enum: [ACT, ABSTAIN]
        failure_class:
          type: string
          description: Optional finance-domain tag. Prefer a map label when it fits, or propose a concise new class when the observed runtime experience does not fit the map.
        domain_tags:
          type: array
          items: {type: string}
          description: Optional extensible finance, data, execution, or runtime tags grounded in the inspected evidence.
        search_operator:
          type: string
          enum: [CONTINUE, REUSE, REFINE, REVERT, FUSE, COMPOSE, SYNTHESIZE, SPLIT, ROUTE, NEW_PROBE]
          description: How this intervention relates to prior experience; defaults to NEW_PROBE for older decisions.
        breakdown_stage:
          type: string
          enum: [source_retrieval, requirement_comprehension, specification_preservation, implementation_realization, execution_completion, unable_to_decide]
          description: QuantCodeEval v2 ACT localization; earliest observable stage where the Worker departed from a faithful strategy reproduction.
        observed_symptoms:
          type: array
          items: {type: string}
          description: QuantCodeEval v2 ACT evidence; concrete public/process observations supporting the selected failure class.
        adjacent_failure_classes_considered:
          type: array
          items:
            type: string
            enum: [interface_delivery, data_universe_preprocessing, temporal_causality, formula_parameterization, signal_direction, portfolio_accounting, runtime_completion, isolated_task_specific, unknown]
          description: QuantCodeEval v2 ACT alternatives considered and distinguished from failure_class.
        class_selection_reason:
          type: string
          description: Why observed evidence fits failure_class better than the adjacent alternatives.
        component_state_target:
          type: string
          description: Concrete finance or execution state the selected harness mechanism should change or preserve.
        shared_mechanism:
          type: string
          description: Required for coordinated breadth ACT only when the active contract requires a cross-task shared mechanism. Name the concrete quantitative object, failure mechanism, or executable invariant supported by every task trajectory; a Research-State label alone is insufficient. Omit it when the contract permits target-grounded Quant Research State relation search.
        probe_task_key:
          type: string
          description: Required for coordinated breadth ACT. Select exactly one authorized benchmark:task_id target for the bounded Worker probe.
        research_state_transition:
          type: object
          description: Required for Research-State-guided QuantCodeEval ACT. Reconstruct one task-conditioned state mismatch and predict the observable state transition that the selected harness component should cause. The six states are general research states, not a fixed strategy pipeline.
          properties:
            state_id:
              type: string
              enum: [research_mandate_contract, research_evidence_data, quantitative_representation, research_operation, evaluation_reconciliation, research_artifact_completion]
            expected_state:
              type: string
              description: State implied by the public task and permitted optimization evidence.
            observed_state:
              type: string
              description: State realized in the inspected Worker trajectory or artifact.
            target_state:
              type: string
              description: State the harness intervention should produce in a fresh Worker.
            transition_observable:
              type: string
              description: Concrete trajectory, component-use, invariant, artifact, or official observation showing whether the transition occurred.
          required: [state_id, expected_state, observed_state, target_state, transition_observable]
          additionalProperties: false
        quant_research_state_card:
          type: string
          description: Required for ACT only when the evidence contract enables Quant Research State guided search. Reference the fixed relative Evolver result path quant-research-state-card.json; do not copy the card into this payload.
        selected_relation:
          type: object
          description: Compact task-local relation selected from the materialized state card. Required for ACT only when the Quant Research State card contract flag is enabled; a relation-family label alone is insufficient.
          properties:
            relation_id: {type: string}
            applicability:
              type: string
              description: Public-task or authorized optimize evidence showing why the relation applies.
            predicted_status_change:
              type: string
              description: Observable relation change expected from the intervention.
          required: [relation_id, applicability, predicted_status_change]
          additionalProperties: false
        residual_risk_relation:
          type: object
          description: Optional second quantitative relation that may remain wrong after the primary intervention. Use at most one and only when the materialized State Card contains independent evidence for it.
          properties:
            relation_id: {type: string}
            orthogonality:
              type: string
              description: Why fixing the primary relation does not determine this relation.
            applicability:
              type: string
              description: Public-task or authorized optimize evidence showing why the residual risk applies.
            predicted_status_change:
              type: string
              description: Observable residual-relation change expected from the candidate, or an explicit prediction that it remains unresolved.
            discriminating_observation:
              type: string
              description: Answer-free Worker or artifact observation that tests residual coverage.
          required: [relation_id, orthogonality, applicability, predicted_status_change, discriminating_observation]
          additionalProperties: false
        component_routing:
          type: object
          description: Compact state-conditioned routing decision. Required for ACT only when the Quant Research State card contract flag is enabled.
          properties:
            selected_locus:
              type: string
              enum: [systemprompt, agent_config, tool_descriptions, tools, validator, skills, memory, middleware, routing]
              description: One selected primary harness component role.
            rejected_loci:
              type: array
              items:
                type: object
                properties:
                  locus:
                    type: string
                    enum: [systemprompt, agent_config, tool_descriptions, tools, validator, skills, memory, middleware, routing]
                  reason: {type: string}
                required: [locus, reason]
                additionalProperties: false
          required: [selected_locus, rejected_loci]
          additionalProperties: false
        failure_types:
          type: array
          minItems: 1
          items:
            type: object
            properties:
              type_id: {type: string}
              label: {type: string}
              member_tasks:
                type: array
                minItems: 2
                items: {type: string}
              excluded_tasks:
                type: array
                items: {type: string}
              matched_success_tasks:
                type: array
                items: {type: string}
              evidence_refs:
                type: array
                minItems: 2
                items: {type: string}
            required: [type_id, label, member_tasks, evidence_refs]
            additionalProperties: true
        hypotheses_considered:
          type: array
          minItems: 2
          items:
            type: object
            properties:
              hypothesis_id: {type: string}
              failure_type_id:
                type: string
                description: Required only by the multi-task failure-type contract. Quant property and lineage-refinement decisions may omit it.
              mechanism: {type: string}
              prediction: {type: string}
              success_counterfactual: {type: string}
              insufficient_contrast: {type: boolean}
            required: [hypothesis_id, mechanism, prediction]
            additionalProperties: true
        selected_hypothesis_id: {type: [string, "null"]}
        probe_ids_used:
          type: array
          minItems: 1
          items: {type: string}
        grounded_comparison_probe_ids:
          type: array
          items: {type: string}
          description: Required for semantic_contract_v1 ACT; each ID must name a typed clause/artifact/trace probe that matches the selected hypothesis and contradicts an eliminated competitor.
        hypotheses_eliminated:
          type: array
          items: {type: string}
        evidence_refs:
          type: array
          minItems: 2
          items: {type: string}
        counterevidence: {type: string}
        uncertainty: {type: string}
        components:
          type: array
          items:
            type: string
            enum: [systemprompt, agent_config, tool_descriptions, tools, validator, skills, memory, middleware, routing]
        primary_components:
          type: array
          items:
            type: string
            enum: [systemprompt, agent_config, tool_descriptions, tools, validator, skills, memory, middleware, routing]
          description: QuantCodeEval v2 causal intervention locus; must be a subset of components. Other components may be declared only as bindings required by the same mechanism.
        component_override_reason:
          type: string
          description: Required when QuantCodeEval v2 evidence justifies a primary component outside the failure-class routing prior.
        prediction:
          type: string
          description: Top-level falsifiable outcome of the proposed harness intervention. When an autonomous experiment_spec is present, its required prediction also supplies this outcome.
        failure_signature:
          type: object
          description: Required for answer-rich QuantCodeEval ACT. Describe the reusable failure mechanism to test on another blind-H0 task; do not copy the optimize-task answer.
          properties:
            mechanism_family: {type: string}
            semantic_state: {type: string}
            pipeline_phase: {type: string}
            observable: {type: string}
          required: [mechanism_family, semantic_state, pipeline_phase, observable]
          additionalProperties: true
        experiment_spec:
          type: object
          description: Required only when the evidence contract requests an autonomous Worker probe. The Evolver chooses the mode, optional authorized seed experience, instruction, bounded iteration budget, prediction, and observation that would change the next decision. When the candidate adds a callable component, make the instruction and prediction identify its task-conditioned activation timing and observable; a repair with an existing artifact should not defer the first applicable call only to finalization.
          properties:
            mode:
              type: string
              enum: [repair, from_scratch]
            seed_experience:
              type: [string, "null"]
            worker_instruction: {type: string}
            max_iterations:
              type: integer
              minimum: 1
              maximum: 12
            prediction: {type: string}
            decision_changing_observation: {type: string}
          required: [mode, seed_experience, worker_instruction, max_iterations, prediction, decision_changing_observation]
          additionalProperties: false
        risk_tasks:
          type: array
          items: {type: string}
        abstain_reason: {type: string}
      required: [decision, hypotheses_considered, evidence_refs, counterevidence, uncertainty]
      additionalProperties: true
  required: [discovery]
  additionalProperties: false
