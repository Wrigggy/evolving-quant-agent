type: agent
name: qea_gdpval_worker
max_context_tokens: 200000
system_prompt: ./systemprompt.md
system_prompt_type: jinja
tool_call_mode: openai
max_iterations: 60

llm_config:
  model: ${env.LLM_MODEL}
  base_url: ${env.LLM_BASE_URL}
  api_key: ${env.LLM_API_KEY}
  # Generous total budget (NOT a reasoning cap): with only 8k the model got cut off
  # mid-reasoning and returned empty content. 32k lets reasoning finish AND leave room
  # to emit content/tool calls. Bump further if heavy tasks still truncate.
  max_tokens: 32000
  temperature: 0.2
  stream: true
  api_type: openai_chat_completion
  # timeout (float seconds) -> httpx.Timeout(connect=read=write=pool=timeout). The OpenAI
  # SDK default is connect=5s, and under the startup burst (N sandboxes + N concurrent TLS
  # handshakes through the local SOCKS proxy at once) the proxy can't finish the TLS
  # handshake in 5s -> httpcore.ConnectTimeout on start_tls -> APITimeoutError on every
  # retry. 180s gives the handshake (and large-context prefill) ample margin; steady
  # streaming never approaches the read gap. max_retries default (5) still applies.
  timeout: 180

tools:
  - name: run_shell_command
    yaml_path: ./tool_descriptions/run_shell_command.tool.yaml
    binding: nexau.archs.tool.builtin.shell_tools.run_shell_command:run_shell_command

tracers:
  - import: nexau.archs.tracer.adapters.in_memory:InMemoryTracer
