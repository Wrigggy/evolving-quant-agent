[project]
name = "evolving-quant-agent"
version = "0.1.0"
description = "QEA v0 — a task-family-aware evolutionary harness for quant/finance numeric tasks. Reuses the AHE evolve->falsify->rollback loop with quant semantics."
requires-python = ">=3.10"
# Core is PURE STDLIB on purpose (v0 is a mechanism check): `python run.py --mock`
# and the smoke test need zero third-party packages. The real OpenRouter run and
# the real GDPval B-pile loader add optional extras.
dependencies = []

[project.optional-dependencies]
# Real OpenRouter run (quant_agent / evolve_agent / judge).
real = ["openai>=1.40"]
# Real GDPval B-pile loader (HuggingFace parquet). Without these, the loader
# falls back to bundled offline fixtures so mock + offline still work.
gdpval = ["pandas>=2.0", "pyarrow>=14.0"]
# Real .xlsx artifact production by the B-pile worker (subprocess exec + render).
artifacts = ["openpyxl>=3.1"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["qea"]
